name: Build and publish Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish native Windows app
        shell: pwsh
        run: |
          dotnet publish Island.csproj -c Release -r win-x64 --self-contained true -o dist/Island-Windows
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
      - name: Run built-in checks
        shell: pwsh
        timeout-minutes: 3
        run: |
          foreach ($argument in @('--self-test', '--api-self-test')) {
            $app = Start-Process -FilePath "$PWD/dist/Island-Windows/Island.exe" -ArgumentList $argument -WindowStyle Hidden -Wait -PassThru
            $report = if ($argument -eq '--self-test') { 'self-test.txt' } else { 'api-self-test.txt' }
            Get-Content "dist/Island-Windows/$report"
            if ($app.ExitCode -ne 0) { throw "$argument failed." }
          }
      - name: Create portable ZIP
        shell: pwsh
        run: |
          $root = [IO.Path]::GetFullPath("$PWD/dist/Island-Windows")
          foreach ($name in @('self-test.txt','api-self-test.txt','previews')) {
            $target = [IO.Path]::GetFullPath((Join-Path $root $name))
            if (!$target.StartsWith($root + [IO.Path]::DirectorySeparatorChar)) { throw 'Invalid staging path.' }
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          }
          Copy-Item README.md,THIRD_PARTY_NOTICES.md,Feature-Coverage-1.3.md,Invoke-IslandCommand.ps1 $root
          Compress-Archive -Path "$root/*" -DestinationPath dist/Island-Windows-x64.zip
          $hash = (Get-FileHash dist/Island-Windows-x64.zip -Algorithm SHA256).Hash
          "$hash  Island-Windows-x64.zip" | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - name: Publish first release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.3.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release v1.3.0 already exists; preserving its assets.'; exit 0 }
          gh release create v1.3.0 dist/Island-Windows-x64.zip dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Island 1.3.0 for Windows' --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
